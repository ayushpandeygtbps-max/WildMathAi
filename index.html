<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WildMath - AI Math Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #020617;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #0f172a;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  width: 320px;
}

#question {
  font-size: 30px;
  margin: 20px 0;
}

input {
  padding: 10px;
  font-size: 18px;
  width: 80%;
  text-align: center;
  border-radius: 8px;
  border: none;
}

button {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  background: #22c55e;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

select {
  padding: 8px;
  border-radius: 8px;
  margin-top: 10px;
}

.top {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

#result {
  height: 20px;
  margin-top: 10px;
}

.red {
  color: red;
}
</style>
</head>

<body>
  <audio id="correctSound">
  <source src="dragon-studio-correct-472358.mp3" type="audio/mpeg">
</audio>
  <audio id="bgMusic" loop>
  <source src="Fluffing-a-Duck(chosic.com).mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h2> WildMath </h2>

  <div class="top">
    <div>❤️ Lives: <span id="lives">3</span></div>
    <div>⏱ <span id="timer">10</span>s</div>
  </div>

  <div style="margin-top:10px;">
    🧑 You: <span id="score">0</span> |
    🤖 AI: <span id="aiScore">0</span>
  </div>

  <select id="mode" onchange="changeMode()">
    <option value="easy">Easy</option>
    <option value="normal">Normal</option>
    <option value="hard">Hard</option>
  </select>

  <div id="question">Loading...</div>

  <input type="number" id="answer" placeholder="Answer">
  <br>
  <button onclick="checkAnswer()">Submit</button>

  <div id="result"></div>
</div>
  <div id="downloadBtn" style="position:fixed; top:15px; right:15px; z-index:999;">
  <a href="app-debug.apk" download>
    <button style="
      padding:10px 18px;
      font-size:14px;
      background:#ff4d00;
      color:white;
      border:none;
      border-radius:8px;
    ">
      📱 App
    </button>
  </a>
</div>
  <footer style="position:absolute; bottom:10px; width:100%; text-align:center; font-size:14px; color:gray;">
    Designed and Powered By: <strong>Ayush Pandey</strong>
</footer>
  <button id="musicBtn" onclick="toggleMusic()" style="
  position:fixed;
  bottom:20px;
  right:20px;
  padding:12px;
  border:none;
  border-radius:50%;
  background:#22c55e;
  color:white;
  font-size:18px;
  z-index:999;
">
  🔊
</button>

<script src="script.js"></script>
  <script>
    if (navigator.userAgent.includes("WildMathAi")) {
      document.getElementById("downloadBtn).style.display = "none";
    }
  </script>
</body>
</html>
